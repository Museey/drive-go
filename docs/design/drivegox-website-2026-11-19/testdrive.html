<link rel="stylesheet" href="site.css">
<style>
.top{padding-block:clamp(2rem,5vw,3.5rem) 0}
.top h1{font-size:clamp(1.9rem,4.2vw,2.9rem);font-weight:800;letter-spacing:-.02em;margin-block:.8rem .6rem}
.top h1 em{font-style:normal;background:linear-gradient(100deg,var(--glow),var(--amber) 60%,var(--amber-d));-webkit-background-clip:text;background-clip:text;color:transparent}
.top p{max-width:42rem;font-size:1.03rem}
.sys{display:flex;flex-wrap:wrap;gap:.5rem;margin-top:1.5rem;border:1px solid var(--line2);border-radius:1.2rem;padding:.35rem;background:var(--panel);width:fit-content;max-width:100%}
.sys button{padding:.6rem 1.1rem;border-radius:.9rem;font-weight:700;font-size:.92rem;color:var(--mut);text-align:left;line-height:1.3;transition:.25s}
.sys button small{display:block;font-weight:500;font-size:.74rem;opacity:.85}
.sys button[aria-selected="true"]{background:var(--amber);color:#1A1000}
.lay{display:grid;gap:1.5rem;margin-top:1.75rem;align-items:start}
@media(min-width:64rem){.lay{grid-template-columns:17.5rem minmax(0,1fr)}}
.side{border:1px solid var(--line);border-radius:1.25rem;background:var(--panel);padding:.8rem;max-height:16rem;overflow-y:auto}
@media(min-width:64rem){.side{position:sticky;top:5.25rem;max-height:calc(100vh - 6.5rem)}}
.side h4{font-size:.7rem;letter-spacing:.12em;text-transform:uppercase;color:var(--glow);padding:.8rem .6rem .35rem}
.side a{display:flex;gap:.6rem;align-items:baseline;padding:.45rem .6rem;border-radius:.6rem;font-size:.86rem;line-height:1.45;color:var(--mut);border-left:.15rem solid transparent}
.side a:hover{color:var(--ink);background:var(--panel2)}
.side a i{font-style:normal;font-size:.7rem;color:var(--faint);font-variant-numeric:tabular-nums;flex:none;width:1.4rem}
.side a[aria-current]{color:var(--glow);background:rgba(251,191,36,.09);border-left-color:var(--glow);font-weight:600}
.prog{height:.2rem;background:var(--panel2);border-radius:.2rem;overflow:hidden;margin-bottom:1.1rem}
.prog i{display:block;height:100%;background:linear-gradient(90deg,var(--amber-d),var(--glow));transition:width .4s}
.cnt{font-size:.78rem;font-weight:700;letter-spacing:.12em;color:var(--glow);font-variant-numeric:tabular-nums;text-transform:uppercase}
.step h2{font-size:clamp(1.4rem,2.8vw,1.9rem);margin-block:.35rem .5rem}
.step>p{max-width:46rem}
.shot{margin-top:1.25rem;border:1px solid var(--line2);border-radius:1rem;overflow:hidden;background:#0D0D0F;position:relative;box-shadow:0 1.75rem 4rem -1.75rem #000,0 0 0 1px rgba(251,191,36,.1);cursor:zoom-in;display:block;width:100%;padding:0}
.shot img{display:block;width:100%;height:auto}
.shot.ph{max-width:23rem;margin-inline:auto;border-radius:2rem;border:.45rem solid #050506;outline:1px solid var(--line2)}
.pin{position:absolute;width:1.6rem;height:1.6rem;margin:-.8rem 0 0 -1.9rem;border-radius:50%;background:var(--amber);color:#1A1000;font-weight:800;font-size:.76rem;display:grid;place-items:center;box-shadow:0 0 0 .22rem rgba(251,191,36,.3),0 .3rem .8rem rgba(0,0,0,.5);pointer-events:none}
.pin::after{content:"";position:absolute;inset:0;border-radius:50%;border:.125rem solid var(--glow);animation:ping 1.8s ease-out infinite}
.shot.ph .pin{margin-left:-.5rem}
@keyframes ping{from{transform:scale(1);opacity:.9}to{transform:scale(2.2);opacity:0}}
.keys{list-style:none;display:grid;grid-template-columns:repeat(auto-fit,minmax(15rem,1fr));gap:.6rem;margin-top:1rem}
.keys li{display:flex;gap:.7rem;align-items:center;padding:.65rem .9rem;border:1px solid var(--line);border-radius:.8rem;background:var(--panel);color:var(--ink);font-size:.9rem;line-height:1.45}
.keys b{width:1.5rem;height:1.5rem;border-radius:50%;background:var(--amber);color:#1A1000;display:grid;place-items:center;font-size:.74rem;flex:none}
.navb{display:flex;justify-content:space-between;gap:.75rem;margin-top:1.5rem;flex-wrap:wrap}
.navb .btn[disabled]{opacity:.35;pointer-events:none}
.navb .prev svg{transform:rotate(180deg)}
.hint{font-size:.8rem;color:var(--faint);margin-top:.9rem}
.lb{position:fixed;inset:0;z-index:80;background:rgba(5,5,6,.92);display:none;overflow:auto;padding:1rem;cursor:zoom-out}
.lb.on{display:block}.lb img{display:block;margin:auto;max-width:none;width:min(100%,110rem);border-radius:.6rem}
.lb.ph img{width:min(100%,32rem)}
.lb button{position:fixed;top:1rem;right:1rem;width:2.6rem;height:2.6rem;border-radius:50%;background:var(--amber);color:#1A1000;font-size:1.2rem;font-weight:800}
.end{margin-top:2.5rem;border:1px solid rgba(251,191,36,.35);border-radius:1.25rem;padding:1.5rem;background:radial-gradient(30rem 12rem at 0 0,rgba(245,158,11,.15),transparent 60%),var(--panel);display:flex;gap:1rem;align-items:center;justify-content:space-between;flex-wrap:wrap}
.end b{color:var(--ink);font-size:1.1rem;display:block}
</style>
</head>

<script>
const CAP={
/* ProX / BaziX */
'x-setting':['ตั้งค่าองค์กร','เริ่มจากกรอกชื่ออู่ ที่อยู่ เลขผู้เสียภาษี บัญชีธนาคาร และสถานะ VAT ข้อมูลชุดนี้ขึ้นหัวเอกสารทุกฉบับอัตโนมัติ','Organisation settings','Start by entering the garage name, address, tax ID, bank accounts and VAT status. This data fills the header of every document.','机构设置','先填写门店名称、地址、税号、银行账户和增值税状态，这些资料会自动出现在每张单据的抬头。'],
'x-home':['หน้าแรก Mr.DriveGo','แดชบอร์ดรวมสิ่งที่ต้องทำวันนี้ เอกสารรออนุมัติ ลูกหนี้เกินกำหนด นัดหมายลูกค้า งานค้างส่งมอบ และสัดส่วนยี่ห้อรถที่เข้าซ่อม','Home: Mr.DriveGo','A dashboard of what needs attention today: approvals, overdue receivables, appointments, cars awaiting handover and the mix of brands serviced.','首页 Mr.DriveGo','汇总今天要处理的事项：待审批单据、逾期应收、客户预约、待交车工单，以及进厂车辆品牌占比。'],
'x-crm':['ลูกค้าสัมพันธ์','บันทึกนัดหมายและติดตามลูกค้า ระบบแจ้งล่วงหน้า 7 วัน ทั้งนัดเข้าซ่อมและลูกค้าเป้าหมายที่ควรเชิญกลับมา','Customer follow-up','Record appointments and follow-ups. The system flags them seven days ahead, for booked visits and for customers worth inviting back.','客户关系','记录预约与回访，系统提前 7 天提醒，包括已预约进厂和值得邀请回店的客户。'],
'x-cust-list':['รายชื่อลูกค้าและรถ','ฐานลูกค้าพร้อมรถในความดูแล ค้นด้วยชื่อ เบอร์โทร หรือทะเบียนรถ และเปิดแฟ้มประวัติได้จากแถวเดียว','Customers and cars','The customer base with every car in your care. Search by name, phone or plate and open the history file from the row.','客户与车辆名单','客户资料及其名下车辆，可按姓名、电话或车牌搜索，并在同一行打开履历档案。'],
'x-cust-grade':['สรุปลูกค้าตามเกรดดาว','จัดเกรดลูกค้าจากยอดใช้บริการสะสม เห็นว่ากลุ่มใดสร้างรายได้และกำไรมากที่สุด','Customers by star grade','Customers are graded by accumulated spend, showing which group brings the most revenue and profit.','客户星级汇总','按累计消费给客户评级，看清哪一类客户带来最多收入和利润。'],
'x-prox-book':['คิวจองจากแอป DriveGo BOOK','ใบจองจากผู้ใช้รถเข้าคิวของอู่อัตโนมัติ กดรับงานเพื่อเปิดใบเสนอราคาได้ทันที','Bookings from DriveGo BOOK','Bookings made by drivers land in the garage queue. Accept one to open a quotation straight away.','来自 DriveGo BOOK 的预约','车主的预约自动进入门店排队，点击接单即可直接开立报价单。'],
'x-prox-inq':['อาการเสียจากลูกค้า สู่ใบเสนอราคา','ลูกค้าพิมพ์อาการเสียมาจากแอป ระบบกรอกข้อมูลรถให้ อู่เติมราคาแล้วส่งใบเสนอราคากลับ','From symptom to quotation','The customer describes the fault in the app, the system fills in the car details, and the garage adds a price and replies.','从故障描述到报价单','客户在应用中描述故障，系统自动带入车辆资料，门店填写价格后回传报价单。'],
'x-prox-sos':['งานฉุกเฉิน SOS ใกล้อู่','คำขอความช่วยเหลือฉุกเฉินจากผู้ใช้รถในพื้นที่ รับงานแล้วลูกค้าเห็นสถานะทันที','Roadside SOS near you','Emergency requests from drivers nearby. Once accepted, the customer sees the status immediately.','附近的 SOS 救援','附近车主的紧急求助，接单后客户立即看到状态。'],

'x-receipt-doc':['ใบแจ้งหนี้ / ใบเสร็จรับเงิน','ดึงรายการจากใบเสนอราคาที่อนุมัติแล้ว เลขที่เอกสารเรียงอัตโนมัติ และบันทึกรับชำระได้ในหน้าเดียว','Invoices and receipts','Lines are pulled from the approved quotation, numbering is automatic, and payment is recorded on the same page.','发票 / 收据','从已批准的报价单带入明细，单号自动编排，并在同一页登记收款。'],
'x-receipt-billing':['ใบวางบิล','รวมใบแจ้งหนี้หลายใบของลูกค้าเครดิตเป็นใบวางบิลเดียว พร้อมติดตามวันครบกำหนด','Billing notes','Combine several invoices for a credit customer into one billing note and track the due date.','对账单','把赊账客户的多张发票合并为一张对账单，并跟踪到期日。'],
'x-receipt-tax':['ใบกำกับภาษี','ออกใบกำกับภาษีจากใบเสร็จ คำนวณ VAT 7% และจำนวนเงินตัวอักษรให้อัตโนมัติ','Tax invoices','Issue a tax invoice from a receipt, with 7% VAT and the amount in words calculated for you.','税务发票','由收据开具税务发票，自动计算 7% 增值税和金额大写。'],
'x-vendor':['ข้อมูลผู้ขาย','ทะเบียนซัพพลายเออร์ เงื่อนไขเครดิต และข้อมูลบัญชีสำหรับจ่ายเงิน','Vendors','The supplier register, with credit terms and payment account details.','供应商资料','供应商台账，含账期条件和付款账户信息。'],
'x-buy-gr':['ใบรับสินค้า / ซื้อสินค้า','บันทึกซื้ออะไหล่เข้าคลัง สต๊อกเพิ่มทันที และตั้งเจ้าหนี้ตามวันครบกำหนด','Goods received','Record parts purchases. Stock goes up immediately and a payable is set against the due date.','收货单 / 采购','登记配件采购入库，库存即时增加，并按到期日挂应付账款。'],
'x-buy-util':['ค่าน้ำ ค่าไฟ และสาธารณูปโภค','บันทึกค่าสาธารณูปโภครายเดือน ลงบัญชีค่าใช้จ่ายให้อัตโนมัติ','Utilities','Record monthly utility bills, posted to expenses automatically.','水电等公用事业费','登记每月水电等费用，自动记入费用科目。'],
'x-buy-asset':['ซื้อสินทรัพย์ถาวร','บันทึกเครื่องมือและอุปกรณ์ที่ซื้อ ระบบขึ้นทะเบียนสินทรัพย์และคิดค่าเสื่อมราคาต่อ','Fixed asset purchases','Record tools and equipment. They are added to the asset register and depreciated from there.','购置固定资产','登记购入的工具与设备，系统自动列入资产台账并计提折旧。'],
'x-buy-pay':['จ่ายเงินเดือนพนักงาน','ทำจ่ายเงินเดือนรายเดือน หักประกันสังคม และเก็บประวัติการจ่ายย้อนหลัง','Payroll','Run monthly payroll with social security deductions, and keep the payment history.','发放员工工资','按月发薪并扣缴社保，保留历史发放记录。'],
'x-buy-office':['อุปกรณ์และวัสดุสำนักงาน','บันทึกรายจ่ายวัสดุสิ้นเปลืองของสำนักงาน แยกหมวดชัดเจน','Office supplies','Record spending on office consumables in its own category.','办公用品','登记办公耗材支出，分类清晰。'],

  $('#end').innerHTML=`<div><b>${u.endh}</b>${u.endp}</div><a class="btn btn-a" href="index.html#contact">${u.demo}<svg class="ic"><use href="#i-arrow"/></svg></a>`;

  const on=$('#side a[aria-current]'); if(on){const sd=$('#side');sd.scrollTop=on.offsetTop-sd.clientHeight/2}
}
function route(scroll){
  const id=location.hash.slice(1);
  if(AUTO[id]){cur=id;sys=Object.keys(ORDER).find(s=>ORDER[s].includes(id))}
  render(); if(scroll)$('.lay').scrollIntoView({behavior:'smooth',block:'start'});
}
$('#sys').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;sys=b.dataset.s;cur=ORDER[sys][0];history.replaceState(null,'','#'+cur);render()});
addEventListener('hashchange',()=>route(true));
addEventListener('keydown',e=>{if($('#lb').classList.contains('on')){if(e.key==='Escape')$('#lb').classList.remove('on');return}
  const l=ORDER[sys],i=l.indexOf(cur);if(e.key==='ArrowRight'&&l[i+1])location.hash=l[i+1];if(e.key==='ArrowLeft'&&l[i-1])location.hash=l[i-1]});
document.addEventListener('click',e=>{if(e.target.closest('#shot')){$('#lbi').src='tour/'+cur+'.webp';$('#lb').className='lb on'+(sys==='book'?' ph':'');return}
  if(e.target.closest('#lb'))$('#lb').classList.remove('on')});
DG.onLang(()=>route(false)); DG.start();
</script>
</body>
