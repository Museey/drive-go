<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DriveGo X Test Drive</title>
<link rel="icon" href="/site/logo.jpg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=IBM+Plex+Sans+Thai:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="/site/sub.css">
<link rel="stylesheet" href="/site/testdrive.css">
<script src="/site/sub.js" defer></script>
<script src="/site/testdrive.js" defer></script>
</head>
<body data-page="testdrive">
<svg class="sprite" width="0" height="0" aria-hidden="true"><defs><symbol id="i-arrow" viewBox="0 0 24 24"><path d="M5 12h14M13 6l6 6-6 6"/></symbol></defs></svg>
<header class="nav" id="hdr"></header>
<main>
  <div class="wrap">
    <section class="top fade">
      <span class="eyebrow">Test Drive</span>
      <h1 id="h1"></h1>
      <p id="sub"></p>
      <div class="sys" role="tablist" id="sys"></div>
    </section>
    <div class="lay">
      <nav class="side" id="side" aria-label="Steps"></nav>
      <section class="step" id="step" aria-live="polite"></section>
    </div>
    <div class="end" id="end"></div>
  </div>
</main>
<div class="lb" id="lb" role="dialog" aria-modal="true"><button type="button" aria-label="Close">×</button><img alt="" id="lbi" src="data:image/gif;base64,R0lGODlhAQABAAAAACH5BAEKAAEALAAAAAABAAEAAAICTAEAOw=="></div>
<footer id="ftr"></footer>
</body>
</html>
