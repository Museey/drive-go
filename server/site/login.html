<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DriveGo X Login</title>
<meta name="description" content="เข้าสู่ระบบ DriveGo BaziX, DriveGo ProX และ DriveGo-Franchise">
<meta name="theme-color" content="#0A0A0B">
<link rel="icon" href="/site/logo.jpg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=IBM+Plex+Sans+Thai:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="/site/sub.css">
<link rel="stylesheet" href="/site/login.css">
<script src="/site/sub.js" defer></script>
<script src="/site/login.js" defer></script>
</head>
<!-- The central sign-in page: the team's design (docs/design/drivegox-website-2026-11-19/login.html) with DriveGo's
     sign-in form in the card picked (login.js; docs/NOTES.md "หน้าแรกและหน้าเข้าระบบกลาง"). -->
<body data-page="login">
<svg class="sprite" width="0" height="0" aria-hidden="true"><defs>
  <symbol id="i-arrow" viewBox="0 0 24 24"><path d="M5 12h14M13 6l6 6-6 6"/></symbol>
  <symbol id="i-check" viewBox="0 0 24 24"><path d="M5 12.500l4.500 4.500L19 7"/></symbol>
  <symbol id="i-box" viewBox="0 0 24 24"><path d="M21 8l-9-5-9 5v8l9 5 9-5zM3 8l9 5 9-5M12 13v8"/></symbol>
  <symbol id="i-cloud" viewBox="0 0 24 24"><path d="M7 18a4.500 4.500 0 0 1-.6-9A6 6 0 0 1 18 8.500a4.500 4.500 0 0 1-.5 9.500z"/></symbol>
  <symbol id="i-book" viewBox="0 0 24 24"><path d="M5 4h11a3 3 0 0 1 3 3v13H8a3 3 0 0 1-3-3zM5 17a3 3 0 0 1 3-3h11M9 8h6"/></symbol>
  <symbol id="i-down" viewBox="0 0 24 24"><path d="M12 4v11M7 11l5 5 5-5M5 20h14"/></symbol>
  <symbol id="i-wheel" viewBox="0 0 48 48"><circle cx="24" cy="24" r="22"/><circle cx="24" cy="24" r="15"/><circle cx="24" cy="24" r="4"/><path d="M24 9v11M24 28v11M9 24h11M28 24h11M13.400 13.400l7.800 7.800M26.800 26.800l7.800 7.800M34.600 13.400l-7.800 7.800M21.200 26.800l-7.800 7.800"/></symbol>
</defs></svg>

<header class="nav" id="hdr"></header>
<main>
  <section class="stage">
    <div class="garage"><svg id="garage" viewBox="0 0 1440 800" preserveAspectRatio="xMidYMid slice" aria-hidden="true"></svg></div>
    <div class="aura"></div>
    <div class="wrap">
      <div class="head fade">
        <span class="eyebrow" id="eb"></span>
        <h1 id="h1"></h1>
        <p id="sub"></p>
      </div>
      <div class="cards" id="cards"></div>
      <form id="signin" novalidate hidden>
        <label for="code" id="lCode"></label>
        <input id="code" name="code" autocomplete="organization" autocapitalize="none" spellcheck="false" required>
        <label for="user" id="lUser"></label>
        <input id="user" name="user" autocomplete="username" autocapitalize="none" spellcheck="false" required>
        <label for="pass" id="lPass"></label>
        <input id="pass" name="pass" type="password" autocomplete="current-password" required>
        <p class="error" id="error" role="alert" hidden></p>
        <button class="btn btn-a" type="submit" id="go"></button>
        <div class="hint" id="hint"></div>
      </form>
      <div class="man fade" id="man"></div>
      <p class="help" id="help"></p>
    </div>
  </section>
</main>
<footer id="ftr"></footer>
</body>
</html>
