<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DriveGo X Articles</title>
<link rel="icon" href="/site/logo.jpg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=IBM+Plex+Sans+Thai:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="/site/sub.css">
<link rel="stylesheet" href="/site/articles.css">
<script src="/site/sub.js" defer></script>
<script src="/site/articles.js" defer></script>
</head>
<body data-page="articles">
<svg class="sprite" width="0" height="0" aria-hidden="true"><defs>
  <symbol id="i-arrow" viewBox="0 0 24 24"><path d="M5 12h14M13 6l6 6-6 6"/></symbol>
</defs></svg>
<header class="nav" id="hdr"></header>
<main id="main">
  <div class="wrap list">
    <section class="top fade">
      <span class="eyebrow" id="eb"></span>
      <h1 id="h1"></h1>
      <p id="sub"></p>
      <div class="filter" id="filter" role="group"></div>
    </section>
    <div class="grid" id="grid"></div>
    <p class="disc" id="disc"></p>
  </div>
  <div class="wrap reader">
    <article class="body" id="body"></article>
    <aside><div class="pn" id="side"></div></aside>
  </div>
</main>
<footer id="ftr"></footer>
</body>
</html>
