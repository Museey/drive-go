# Every push runs everything the project's rules count (CLAUDE.md, task T11):
# checks and server tests, every scenario against the legacy app (its goldens)
# and against the new system, and the referees' self-check. All jobs run in
# the same pinned environment (.github/actions/setup). The test server's image
# is built and tried too (task 3.16). A run where all of it passed on the main
# branch is what .github/workflows/deploy.yml takes to the server (deploy/test,
# which DigitalOcean deploys, .do/app.yaml): each night at 23:30 Bangkok time
# or by hand (security review 2026-11-23 ก7), so a push that fails a check
# never reaches the server, and one that passes does not restart it while
# garages work.
name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NEXT_TELEMETRY_DISABLED: '1'

jobs:
  checks:
    name: Checks, unit and database tests
    runs-on: ubuntu-24.04
    container:
      image: mcr.microsoft.com/playwright:v1.56.1-noble
      options: --shm-size=2g
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - run: npm run typecheck
      - run: npm run test:unit
      - run: npm run test:db
      - run: node tools/split-legacy.mjs --check
      - run: node tools/build-client.mjs --check

  scenarios:
    name: Scenarios, ${{ matrix.target }} ${{ matrix.shard }}/4
    runs-on: ubuntu-24.04
    container:
      image: mcr.microsoft.com/playwright:v1.56.1-noble
      options: --shm-size=2g
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        target: [legacy, new]
        shard: [1, 2, 3, 4]
    env:
      TARGET: ${{ matrix.target }}
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - run: npx playwright test --shard=${{ matrix.shard }}/4
      - if: failure()
        run: node tools/ci-diff-report.mjs
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: results-${{ matrix.target }}-${{ matrix.shard }}
          path: test-results/
          retention-days: 14

  selfcheck:
    name: Referees still catch breakage
    runs-on: ubuntu-24.04
    container:
      image: mcr.microsoft.com/playwright:v1.56.1-noble
      options: --shm-size=2g
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - run: npm run selfcheck

  image:
    name: Test server image builds and runs
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.22.0
          cache: npm
      - run: npm ci
      - run: docker build -t drivego:smoke .
      # PostgreSQL 16 of the runner image (tools/pg-temp.mjs), TLS with a CA of its own as the managed database
      - run: node tools/image-smoke.mjs drivego:smoke
