# When the server garages use gets a new version (security review 2026-11-23, docs/SECURITY-AUDIT-2026-11.md ก7): CI
# no longer deploys every push that passes. This moves deploy/test (DigitalOcean deploys that branch, .do/app.yaml)
# to the newest commit of the main branch whose CI passed:
#   · at night, between 23:00 and 06:00 Bangkok time, when garages do not work, so the server does not restart and
#     the schema does not change while they do. GitHub starts scheduled runs late, by hours at times (the first nights
#     of 2026-11 ran at 07:36–09:59 Bangkok time), so it is asked every hour from 23:07 to 04:07 and a run that starts
#     outside the night does nothing; once deploy/test is at the newest commit the later ones do nothing either;
#   · now, from GitHub: Actions → "Deploy to the test server" → Run workflow (an urgent fix). A commit may be given;
#     it must be on the main branch and its CI must have passed.
# Forward only: an older commit never moves the server back.
name: Deploy to the test server

on:
  schedule:
    - cron: '7 16-21 * * *'
  workflow_dispatch:
    inputs:
      commit:
        description: 'Commit to deploy (empty: the newest whose CI passed)'
        required: false
        default: ''

concurrency:
  group: deploy-test
  cancel-in-progress: false

jobs:
  deploy:
    name: Move deploy/test to the newest commit that passed CI
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      actions: read
    env:
      MAIN: claude/brave-goodall-0qn0qg
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Only at night (a scheduled run)
        id: night
        run: |
          h=$(TZ=Asia/Bangkok date +%H)
          if [ "$GITHUB_EVENT_NAME" = schedule ] && ! [[ "$h" =~ ^(23|00|01|02|03|04|05)$ ]]; then
            echo "started at ${h}:xx Bangkok time, outside 23:00–06:00: nothing to do (the next night's runs deploy)"
            echo "skip=1" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v4
        if: steps.night.outputs.skip != '1'
        with:
          ref: claude/brave-goodall-0qn0qg
          fetch-depth: 0
      - name: Choose the commit
        if: steps.night.outputs.skip != '1'
        id: pick
        env:
          COMMIT: ${{ inputs.commit }}
        run: |
          set -euo pipefail
          passed=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow ci.yml --branch "$MAIN" --event push --status success \
            --limit 100 --json headSha --jq '.[].headSha')
          want="${COMMIT:-}"
          if [ -n "$want" ]; then
            want=$(git rev-parse --verify "$want^{commit}")
            echo "$passed" | grep -qx "$want" || { echo "CI has not passed on $want"; exit 1; }
          else
            want=$(echo "$passed" | head -n 1)
          fi
          [ -n "$want" ] || { echo "no commit has passed CI"; exit 1; }
          git merge-base --is-ancestor "$want" "origin/$MAIN" || { echo "$want is not on $MAIN"; exit 1; }
          echo "sha=$want" >> "$GITHUB_OUTPUT"
          git log -1 --format='deploying %h %s (%ci)' "$want"
      - name: Move deploy/test (forward only)
        if: steps.night.outputs.skip != '1'
        env:
          WANT: ${{ steps.pick.outputs.sha }}
        run: |
          set -euo pipefail
          want="$WANT"
          if git fetch origin deploy/test 2>/dev/null; then
            if [ "$(git rev-parse FETCH_HEAD)" = "$want" ]; then echo "deploy/test is at $want already"; exit 0; fi
            git merge-base --is-ancestor FETCH_HEAD "$want" || { echo "deploy/test is not behind $want"; exit 0; }
          fi
          git push origin "$want:refs/heads/deploy/test"
